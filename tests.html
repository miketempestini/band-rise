<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Band Rise Tests</title>
  <script>document.write('<script src="js/files.js?' + Date.now() + '"><\/script>');</script>
  <script>Game.files.writeCss();</script>
  <style>
    /* Styles only for the test page. */
    body { padding: 32px 48px; font-family: Menlo, Consolas, monospace; }
    h1 { margin: 0 0 8px; color: var(--accent); }
    .summary { font-size: 20px; margin: 0 0 24px; }
    .summary--pass { color: var(--good); }
    .summary--fail { color: var(--bad); }
    #results { list-style: none; padding: 0; margin: 0; }
    .test { padding: 8px 12px; margin-bottom: 4px; background: var(--panel); border-left: 4px solid; white-space: pre; }
    .test--pass { border-color: var(--good); }
    .test--fail { border-color: var(--bad); color: var(--bad); }
    .balance { margin-top: 40px; font-family: inherit; }
    .balance h2 { color: var(--accent); }
    .sim { border-collapse: collapse; width: 100%; max-width: 1000px; }
    .sim th, .sim td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .sim tr.ok td:last-child, .balance .ok { color: var(--good); }
    .sim tr.off td:last-child { color: var(--bad); font-weight: bold; }
    .test__detail { margin-top: 4px; padding-left: 24px; color: var(--text-muted); white-space: normal; }
  </style>
</head>
<body>
  <h1>Band Rise Tests</h1>
  <p id="summary" class="summary">Running...</p>
  <ul id="results"></ul>
  <section id="balance" class="balance"><p class="summary">Running the balance check...</p></section>

  <!-- The game and its screens, from the same list as index.html (js/files.js), but not main.js, so nothing starts on
       its own. Then the late-career test save, for the test that opens every screen. -->
  <script>Game.files.write(Game.files.game.concat(Game.files.screens, ['test-saves/late-career.js']));</script>

  <!-- The test runner, then one test file per system -->
  <script src="js/tests/test-runner.js"></script>
  <script src="js/tests/rng.test.js"></script>
  <script src="js/tests/career.test.js"></script>
  <script src="js/tests/money.test.js"></script>
  <script src="js/tests/day.test.js"></script>
  <script src="js/tests/save.test.js"></script>
  <script src="js/tests/debug.test.js"></script>
  <script src="js/tests/skills.test.js"></script>
  <script src="js/tests/energy-morale.test.js"></script>
  <script src="js/tests/audience.test.js"></script>
  <script src="js/tests/actions.test.js"></script>
  <script src="js/tests/songs.test.js"></script>
  <script src="js/tests/gigs.test.js"></script>
  <script src="js/tests/people.test.js"></script>
  <script src="js/tests/booking.test.js"></script>
  <script src="js/tests/job.test.js"></script>
  <script src="js/tests/planning.test.js"></script>
  <script src="js/tests/events.test.js"></script>
  <script src="js/tests/progress.test.js"></script>
  <script src="js/tests/recording.test.js"></script>
  <script src="js/tests/band.test.js"></script>
  <script src="js/tests/review.test.js"></script>
  <script src="js/tests/dayjob.test.js"></script>
  <script src="js/tests/road.test.js"></script>
  <script src="js/tests/bigtime.test.js"></script>
  <script src="js/tests/calendar.test.js"></script>
  <script src="js/tests/housing.test.js"></script>
  <script src="js/tests/finances.test.js"></script>
  <script src="js/tests/tours.test.js"></script>
  <script src="js/tests/streaming.test.js"></script>
  <script src="js/tests/scene.test.js"></script>
  <script src="js/tests/global.test.js"></script>
  <script src="js/tests/setlist.test.js"></script>
  <script src="js/tests/tourbuilder.test.js"></script>
  <script src="js/tests/screens.test.js"></script>

  <script src="js/tests/balance.sim.js"></script>

  <script>
    Game.runTests();
    // The balance check runs right after the tests (it takes a few seconds).
    setTimeout(function () {
      Game.balanceSim.render(document.getElementById('balance'), 100, Game.balance.slice.endDay);
      Game.balanceSim.renderLong(document.getElementById('balance'), 50, 90);
      // The two-year check is slow, so it only runs on request: the button, or tests.html?years in the address.
      var years = function () { Game.balanceSim.renderYears(document.getElementById('balance'), 10, 2 * Game.balance.time.daysPerYear); };
      var btn = document.createElement('button');
      btn.textContent = 'Run the two-year balance check (slow)';
      btn.onclick = function () { btn.disabled = true; setTimeout(years, 20); };
      document.getElementById('balance').appendChild(btn);
      if (/[?&]years\b/.test(window.location.search)) years();
    }, 50);
  </script>
</body>
</html>
