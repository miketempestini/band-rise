<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Band Rise</title>
  <!-- The list of files and the version tag (always fetched fresh), then the stylesheet. See js/files.js. -->
  <script>document.write('<script src="js/files.js?' + Date.now() + '"><\/script>');</script>
  <script>Game.files.writeCss();</script>
</head>
<body>
  <!-- The whole game draws inside this box. -->
  <main id="app"></main>
  <!-- The debug panel (only filled in when the address ends in ?debug). -->
  <div id="debug"></div>

  <!--
    Every script, in order, from the list in js/files.js (classic script tags, no modules, so the game works by
    double-clicking this file). Each one gets the version tag, so a new publish always loads together.
  -->
  <script>Game.files.write(Game.files.game.concat(Game.files.screens, Game.files.start));</script>
</body>
</html>
